onboarding = false
# herdr configuration from github.com/joshdholtz/herdr-setup
# Copying this replaces your config; back yours up first (see README).

# ─── Theme ──────────────────────────────────────────────────────────────
# Catppuccin Macchiato with a peach accent, layered dark backgrounds and a
# brighter selection.
[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
accent = "#f5a97f"             # peach
panel_bg = "#0f1117"
sidebar_bg = "#161925"
active_row_bg = "#2e3348"
selection_bg = "#414a6b"       # brighter selection
surface0 = "#1c2030"
surface1 = "#2e3348"
surface_dim = "#3b4058"
overlay0 = "#5b6078"
overlay1 = "#6e738d"
text = "#cad3f5"
subtext0 = "#8f93a2"
blue = "#8aadf4"               # working
yellow = "#eed49f"             # waiting
green = "#a6da95"              # done
red = "#ed8796"                # error
mauve = "#c6a0f6"              # remote accent
teal = "#8bd5ca"
peach = "#f5a97f"

# ─── Terminal / shell ───────────────────────────────────────────────────
[terminal]
shell_mode = "auto"
# New panes open in the same directory as the pane you split from.
new_cwd = "follow"

# ─── Keys ───────────────────────────────────────────────────────────────
[keys]
prefix = "ctrl+b"

# tmux-aligned bindings so muscle memory carries over:
detach = "prefix+d"            # tmux detach (herdr default was prefix+q)
rename_tab = "prefix+comma"    # tmux rename-window
edit_scrollback = "prefix+["   # tmux copy-mode entry
last_pane = "prefix+semicolon" # tmux last-pane
# Direct space jump; prefix+w focuses the sidebar to move between spaces.
switch_workspace = "prefix+shift+1..9"
# In sidebar/navigate mode, move between spaces with vim keys (j down, k up).
navigate_workspace_up = "k"
navigate_workspace_down = "j"

# lazygit in a popup — quick git without leaving the pane layout.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

# btop system monitor in a popup.
[[keys.command]]
key = "prefix+alt+t"
type = "popup"
command = "btop"
width = "90%"
height = "90%"

# gh PR checks/status for the current branch, in a popup.
[[keys.command]]
key = "prefix+alt+p"
type = "popup"
command = "gh pr view --comments 2>/dev/null || gh pr status; echo; read -n1 -r -p 'press any key…'"
width = "80%"
height = "80%"

# Scratch shell popup — quick throwaway command without touching your layout.
[[keys.command]]
key = "prefix+alt+s"
type = "popup"
command = "${SHELL}"
width = "70%"
height = "60%"

# Launch Claude in a new pane (down split).
[[keys.command]]
key = "prefix+alt+c"
type = "pane"
command = "claude"

# herdr-navigator: fuzzy jump to any space, agent, project or folder.
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

# Workstream home page: open or focus this space's "home" tab (ws open).
[[keys.command]]
key = "prefix+alt+h"
type = "plugin_action"
command = "workstreams.open"
description = "workstream home page"

# ─── UI ─────────────────────────────────────────────────────────────────
[ui]

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "$HOME/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar${HERDR_SESSION:+-$HERDR_SESSION}.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

accent = "#f5a97f"          # peach
copy_on_select = true
# Borders on: focused pane outlined in the accent color, others dim.
pane_borders = "auto"
pane_outer_borders = true
pane_gaps = true
pane_scrollbars = false
sidebar_width = 31
# Show which agent is in each pane on the border when unnamed.
show_agent_labels_on_pane_borders = false
# Cleaner look: hide the tab bar when a workspace has only one tab.
hide_tab_bar_when_single_tab = false
# Order the agent panel by who needs attention, not just by space.
agent_panel_sort = "priority"
# Don't nag for a name every time — generate one, rename later if needed.
prompt_new_tab_name = false

# Desktop notifications when a background agent changes state.
[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

# ─── Sessions ───────────────────────────────────────────────────────────
[session]
# Bring AI-agent panes back into their conversations after a server restart.
resume_agents_on_restore = true

# ─── Experimental ───────────────────────────────────────────────────────
[experimental]
# Native Kitty graphics for the browser plugin (Ghostty, Kitty and WezTerm support it).
kitty_graphics = true
# Keep pane screen history across server restarts.
pane_history = true

